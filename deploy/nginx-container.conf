# nginx DENTRO del contenedor. El TLS y el dominio los gestiona el nginx del
# host, que hace de proxy: aquí se sirve en claro por el puerto 80 interno.
server {
    listen 80;
    # La imagen de nginx activa IPv6 al arrancar, pero solo sobre el
    # default.conf que este fichero sustituye. Sin esta linea nginx escucha
    # unicamente en IPv4 y cualquier cliente que resuelva `localhost` a ::1
    # (el healthcheck, entre otros) recibe "connection refused".
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backoffice es una SPA: las rutas (/admin, /login, /points...) las
    # resuelve GetX en el navegador y no existen como ficheros. Sin esto,
    # recargar la página en cualquier ruta que no sea "/" da un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros con hash en el nombre no cambian nunca: se cachean fuerte.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NO se cachea: es lo que apunta a la versión nueva del JS.
    # Si se cacheara, un despliegue nuevo no llegaría al navegador hasta que
    # el usuario forzara la recarga.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # flutter_service_worker.js decide cuándo se actualiza la app: cachearlo
    # deja al usuario clavado en la versión anterior.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
}
